name: Bug report
description: Something in Steltic India did not work
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Version or commit, placeholder: "v0.3.0 or abc1234"}
    validations: {required: true}
  - type: dropdown
    id: os
    attributes: {label: Operating system, options: [Windows 11, Windows 10, macOS, Linux]}
    validations: {required: true}
  - type: input
    id: model
    attributes: {label: LLM and provider, placeholder: "e.g. model name via provider, or MOCK"}
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Steps, the brief or example (in1 … in20 on HR Steel, in1 … in15 on CFS), and the error text."}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Logs, description: "Paste the run log or attach STATUS.md / run_stdout.txt. Remove API keys.", render: text}
