[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steltic-hub-india"
version = "0.2.2"
description = "Steltic Hub India: one window over the India (IS 800 / IS 801 / IS 875 / IS 1893) Steltic modules, per-module Python environments, input tabs on top of the viewer bundle"
readme = "README.md"
license = "MIT"
# The hub itself has no openseespy bound -- it never imports module code. Each module gets its
# own interpreter (3.12 by default) provisioned by uv, which is what keeps that constraint local.
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
steltic-hub = "steltic_hub.cli:main"
steltic-hub-india = "steltic_hub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["steltic_hub"]
