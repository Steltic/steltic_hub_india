[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steltic-probabilistic"
version = "0.1.0"
description = "Probabilistic analysis (India): Monte Carlo as-built variations of an HR Steel (IS 800) design, re-analysed with the design's own IS 800 model and checked against its own IS 800 design strengths"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27", "python-multipart>=0.0.9", "numpy>=1.24"]

[tool.hatch.build.targets.wheel]
packages = ["probabilistic"]
